# Example configuration for training an EAGLE-3-style drafter on Gemma.
# This is the frozen assistant/target model used for tokenization, hidden states, and embeddings.

assistant_model_path: google/gemma-4-e2b-it
train_data_dir: data/tokenized/gemma4/train
eval_data_dir: data/tokenized/gemma4/eval
test_data_dir: data/tokenized/gemma4/test
output_dir: outputs/gemma4_eagle3_draft
tensorboard_log_dir: outputs/gemma4_eagle3_draft/tensorboard

# Optional: set this to continue fine-tuning an existing drafter checkpoint.
# It can point to either a checkpoint directory or directly to draft_model.pt.
resume_draft_checkpoint_path:

# Use low, middle, and high target hidden states from the assistant model.
# You can auto-overwrite this using scripts/configure_from_assistant.py.
target_hidden_layer_indices: [8, 16, 26]

max_length: 2048
draft_hidden_size: 1024
draft_num_layers: 4
draft_num_heads: 8
draft_intermediate_size: 4096
dropout: 0.0

learning_rate: 0.0002
weight_decay: 0.01
warmup_steps: 100
gradient_accumulation_steps: 4
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
num_train_epochs: 1
max_steps: -1
logging_steps: 10
eval_steps: 200
save_steps: 500
seed: 42

bf16: true
fp16: false

# Scheduled sampling probability for replacing some previous ground-truth tokens
# with drafter predictions during training. Start with 0.0 for stability.
scheduled_sampling_prob: 0.0

# Optional memory helpers.
gradient_checkpointing: true
trust_remote_code: true
